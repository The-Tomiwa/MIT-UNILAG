# Render blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: gpon-framework
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_USERNAME
        value: admin
      - key: APP_PASSWORD
        sync: false   # you type this in the Render dashboard; never commit it
